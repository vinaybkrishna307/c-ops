<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vinay B — CV</title>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
      font-weight: 300 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'DM Sans';
      src: url('./fonts/dm-sans-latin.woff2') format('woff2');
      font-weight: 100 1000;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    body {
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      color: #1a1a1a;
      background: #ffffff;
      padding: 0.35in 0.45in 0.25in;
      margin: 0;
    }

    .page {
      width: 100%;
      max-width: 210mm;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header { margin-bottom: 8px; }

    .header-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #0f0f0f;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 3px;
    }

    .header-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: #444;
      letter-spacing: 0.01em;
      margin-bottom: 4px;
    }

    .header-contact {
      font-size: 10.5px;
      color: #555;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
    }

    .header-contact span,
    .header-contact a { color: #555; text-decoration: none; }

    .header-contact .dot { margin: 0 4px; color: #999; }

    /* ── DIVIDERS ── */
    .divider {
      border: none;
      border-top: 1px solid #1a1a1a;
      margin: 8px 0 10px;
    }

    .thin-rule {
      border: none;
      border-top: 0.5px solid #d0d0d0;
      margin: 8px 0 10px;
    }

    /* ── SECTION ── */
    .section { margin-bottom: 10px; }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    /* ── SUMMARY ── */
    .summary {
      font-size: 11px;
      line-height: 1.5;
      color: #2a2a2a;
    }

    /* ── SKILLS ── */
    .skills-block { display: grid; gap: 2px; }

    .skill-row {
      display: grid;
      grid-template-columns: 115px 1fr;
      gap: 5px;
      font-size: 10.5px;
      line-height: 1.4;
      align-items: baseline;
    }

    .skill-label { font-weight: 600; color: #1a1a1a; }
    .skill-value { color: #3a3a3a; }

    /* ── EXPERIENCE ── */
    .job {
      margin-bottom: 10px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1px;
    }

    .job-title-company {
      font-size: 12.5px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .job-title-company .separator {
      font-weight: 400;
      color: #666;
      margin: 0 2px;
    }

    .job-date {
      font-size: 9.5px;
      color: #555;
      white-space: nowrap;
    }

    .job-location {
      font-size: 8.5px;
      color: #888;
      margin-bottom: 2px;
    }

    .job-bullets { list-style: none; padding: 0; margin: 0; }

    .job-bullets li {
      font-size: 11px;
      line-height: 1.45;
      color: #2a2a2a;
      padding-left: 11px;
      position: relative;
      margin-bottom: 2px;
    }

    .job-bullets li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: #888;
      font-size: 7.5px;
      top: 2px;
    }

    /* ── PROJECT ── */
    .project {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 3px;
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0px;
    }

    .project-name {
      font-size: 11.5px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .project-link {
      font-size: 9.5px;
      color: #777;
      text-decoration: none;
      display: block;
      margin-top: 0px;
      margin-bottom: 2px;
    }

    /* ── EDUCATION ── */
    .edu-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 9.5px;
    }

    .edu-degree { font-weight: 600; color: #1a1a1a; }
    .edu-school { font-weight: 400; color: #444; }
    .edu-year { font-size: 9.5px; color: #555; white-space: nowrap; }

    /* ── PRINT ── */
    @media print {
      body { padding: 0.35in 0.45in 0.25in; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-name">{{NAME}}</div>
    <div class="header-title">{{SUBTITLE}}</div>
    <div class="header-contact">
      <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
      <span class="dot">·</span>
      <span>{{PHONE}}</span>
      <span class="dot">·</span>
      <span>{{LOCATION}}</span>
      <span class="dot">·</span>
      <a href="{{PORTFOLIO_URL}}">{{PORTFOLIO_DISPLAY}}</a>
      <span class="dot">·</span>
      <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a>
    </div>
  </div>

  <hr class="divider">

  <!-- PROFESSIONAL SUMMARY -->
  <div class="section">
    <div class="section-title">{{SECTION_SUMMARY}}</div>
    <div class="summary">{{SUMMARY_TEXT}}</div>
  </div>

  <hr class="thin-rule">

  <!-- TECHNICAL SKILLS -->
  <div class="section">
    <div class="section-title">{{SECTION_SKILLS}}</div>
    {{SKILLS}}
  </div>

  <hr class="thin-rule">

  <!-- PROFESSIONAL EXPERIENCE -->
  <div class="section">
    <div class="section-title">{{SECTION_EXPERIENCE}}</div>
    {{EXPERIENCE}}
  </div>

  <hr class="thin-rule">

  <!-- PROJECTS -->
  <div class="section">
    <div class="section-title">{{SECTION_PROJECTS}}</div>
    {{PROJECTS}}
  </div>

  <hr class="thin-rule">

  <!-- EDUCATION -->
  <div class="section">
    <div class="section-title">{{SECTION_EDUCATION}}</div>
    {{EDUCATION}}
  </div>

</div>
</body>
</html>
