# =============================================================================
# TRACKED COMPANIES — appended to portals.yml
# =============================================================================
# scan.mjs reads `tracked_companies`. Each entry hits the ATS API directly.
# Zero Google search, zero Playwright, zero token cost.
#
# Usage:
#   node scan.mjs --dry-run    ← verify loading, check for errors
#   node scan.mjs              ← live scan → data/pipeline.md
#
# STATUS: ✅ slug confirmed   ⚠️ slug inferred (fix if 0 results or 404)
# =============================================================================

# ---------------------------------------------------------------------------
# LOCATION FILTER
# ---------------------------------------------------------------------------
location_filter:
  always_allow:
    - "bangalore"
    - "bengaluru"
    - "remote"
    - "india"
    - "hybrid"
  block:
    - "united states"
    - "new york"
    - "san francisco"
    - "london"
    - "berlin"
    - "toronto"
    - "sydney"
    - "amsterdam"
    - "singapore"
    - "dubai"
    - "germany"
    - "france"
    - "canada"
    - "australia"
    - "uk"
    - "united kingdom"

